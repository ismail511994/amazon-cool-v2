<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c4a6e">
<meta name="description" content="أمازون كول — صيانة وتركيب وتشخيص وتجارة أجهزة التكييف">
<title>أمازون كول | HVAC Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* ========== RESET & VARIABLES ========== */
:root{
  --bg:#090d16;--bg2:#0b1220;--card:#151d2a;--card2:#1a2330;
  --blue:#0284c7;--blue2:#06b6d4;--green:#10b981;--amber:#f59e0b;
  --red:#ef4444;--purple:#8b5cf6;
  --txt:#f8fafc;--muted:#94a3b8;--muted2:#64748b;
  --border:#26334d;--border2:#334155;
  --shadow:0 10px 40px rgba(0,0,0,.35);
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:Tajawal,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue2);text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;line-height:1.3}
h2{font-size:20px;font-weight:900;margin:0 0 12px 0;display:flex;align-items:center;gap:8px}
h3{font-size:16px;font-weight:800}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
  /* ========== LAYOUT ========== */
.app{max-width:1180px;margin:0 auto;padding:12px 12px 80px}
.top{position:sticky;top:0;z-index:50;background:rgba(9,13,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0;margin:0 -12px;padding-left:12px;padding-right:12px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand-title{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:20px;font-weight:900;letter-spacing:-.5px}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:1px}
.badge{padding:5px 10px;border-radius:999px;background:#10263a;color:#67e8f9;font-size:11px;font-weight:700;border:1px solid #0e4a66}
.badge.live{background:#052e2b;color:#6ee7b7;border-color:#065f46}
.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px 0;scrollbar-width:none;scroll-snap-type:x proximity}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;border:1px solid var(--border);background:var(--card);color:var(--txt);padding:9px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all .2s;scroll-snap-align:start;white-space:nowrap}
.nav button:hover{border-color:var(--border2)}
.nav button.active{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;box-shadow:0 4px 14px rgba(2,132,199,.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0;transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.card.tight{padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.muted-sm{color:var(--muted);font-size:11px}
.price{font-size:20px;font-weight:900;color:#67e8f9;letter-spacing:-.5px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--txt);padding:10px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--border2);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(2,132,199,.35)}
.btn.primary:hover{box-shadow:0 6px 20px rgba(2,132,199,.5)}
.btn.green{background:#075e4a;border-color:#0b8065;color:#d1fae5}
.btn.amber{background:#78350f;border-color:#a16207;color:#fef3c7}
.btn.red{background:#641d25;border-color:#8e2733;color:#fecaca}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.field{margin:10px 0}
.field label{display:block;color:#cbd5e1;margin-bottom:6px;font-size:13px;font-weight:600}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
.field textarea{min-height:90px;resize:vertical;font-family:inherit}
.field .hint{font-size:11px;color:var(--muted2);margin-top:4px}
.field .error{font-size:12px;color:#fca5a5;margin-top:4px;display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
.field.invalid .error{display:block}
.notice{padding:12px 14px;border-radius:var(--radius-sm);background:#171f2c;border:1px solid var(--border);margin:10px 0;font-size:14px;line-height:1.6}
.notice.ok{border-color:#065f46;background:linear-gradient(135deg,#052e2b,#062e26);color:#d1fae5}
.notice.err{border-color:#7f1d1d;background:linear-gradient(135deg,#351216,#4c1d24);color:#fecaca}
.notice.warn{border-color:#78350f;background:#1c1917;color:#fef3c7}
.notice.info{border-color:#164e63;background:#082f49;color:#cffafe}
.hidden{display:none!important}
.search{position:relative;display:flex;gap:8px;margin:8px 0}
.search input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px 11px 40px;color:var(--txt)}
.search::before{content:"🔍";position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.6}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:#243147;font-size:11px;font-weight:700}
.pill.green{background:#065f46;color:#d1fae5}
.pill.amber{background:#78350f;color:#fef3c7}
.pill.red{background:#7f1d1d;color:#fecaca}
.pill.blue{background:#0c4a6e;color:#cffafe}
.pill.purple{background:#4c1d95;color:#ddd6fe}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fadeIn .2s}
.modal.open{display:flex}
.modalbox{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;max-height:90vh;overflow:auto;box-shadow:var(--shadow);animation:slideUp .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:18px}
.toast-container{position:fixed;bottom:20px;left:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:380px;margin-left:auto;margin-right:0}
.toast{background:linear-gradient(135deg,#052e2b,#065f46);color:#d1fae5;padding:12px 16px;border-radius:var(--radius-sm);border:1px solid #065f46;font-weight:700;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;display:flex;align-items:center;gap:10px;animation:toastIn .3s}
.toast.err{background:linear-gradient(135deg,#4c1d24,#7f1d1d);color:#fecaca;border-color:#7f1d1d}
.toast.info{background:linear-gradient(135deg,#082f49,#0c4a6e);color:#cffafe;border-color:#0c4a6e}
.toast.warn{background:linear-gradient(135deg,#1c1917,#78350f);color:#fef3c7;border-color:#78350f}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .2s;display:flex;flex-direction:column}
.product-card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 12px 30px rgba(2,132,199,.2)}
.product-card .img{aspect-ratio:1/1;background:linear-gradient(135deg,#0d0f14,#151d2a);overflow:hidden;position:relative}
.product-card .img img{width:100%;height:100%;object-fit:cover}
.product-card .img .badge-discount{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900}
.product-card .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.product-card .name{font-weight:800;font-size:14px;line-height:1.35;min-height:38px}
.product-card .actions{margin-top:auto;display:flex;gap:6px}
.product-card .actions .btn{flex:1}
.timeline{position:relative;padding:10px 0;margin:10px 0}
.timeline::before{content:"";position:absolute;right:11px;top:20px;bottom:20px;width:2px;background:var(--border)}
.timeline-step{position:relative;padding-right:36px;padding-bottom:16px;opacity:.4;transition:opacity .3s}
.timeline-step.active{opacity:1}
.timeline-step.done{opacity:1}
.timeline-step::before{content:"";position:absolute;right:4px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--border);border:3px solid var(--bg);z-index:1}
.timeline-step.done::before{background:var(--green)}
.timeline-step.active::before{background:var(--amber);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}50%{box-shadow:0 0 0 8px rgba(245,158,11,0)}}
.timeline-step .label{font-weight:700;font-size:14px}
.timeline-step .time{font-size:11px;color:var(--muted)}
.stat{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat .num{font-size:26px;font-weight:900;color:#67e8f9;letter-spacing:-1px}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.stat.green .num{color:#6ee7b7}
.stat.amber .num{color:#fbbf24}
.stat.red .num{color:#fca5a5}
.stat.purple .num{color:#c4b5fd}
.hero{position:relative;margin:0 0 16px 0;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 14px 50px rgba(2,132,199,.35)}
.hero-bg{height:240px;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.88) 100%),url('https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=800&q=80') center/cover}
.hero-badge{position:absolute;top:14px;right:14px;background:rgba(255,153,0,.95);color:#111;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:900}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:20px 18px}
.hero-pill{display:inline-block;background:linear-gradient(90deg,var(--amber),var(--red));color:#fff;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:900;margin-bottom:10px}
.hero-title{font-size:22px;font-weight:900;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.6);margin-bottom:8px}
.hero-title .accent{color:#fbbf24;font-size:24px}
.hero-sub{color:#e0f2fe;font-size:13px;line-height:1.6;margin-bottom:14px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.emergency-card{cursor:pointer;text-align:center;padding:20px;background:linear-gradient(135deg,#7f1d1d,#450a0a);border:2px solid var(--red);border-radius:var(--radius-lg);margin:14px 0;transition:transform .2s}
.emergency-card:hover{transform:scale(1.02)}
.offline-banner{position:fixed;bottom:0;left:0;right:0;background:var(--red);color:#fff;text-align:center;padding:8px;font-weight:700;font-size:13px;z-index:300;display:none}
.offline-banner.show{display:block}
.loader{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{color:var(--muted);text-align:center;padding:30px 12px;font-size:12px;border-top:1px solid var(--border);margin-top:20px}
.admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.admin-section h3{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.admin-section h3::after{content:"▼";font-size:10px;color:var(--muted);transition:transform .2s}
.admin-section.collapsed h3::after{transform:rotate(-90deg)}
.admin-section.collapsed .content{display:none}
@media (max-width:600px){
  .app{padding:9px 9px 70px}
  .top{margin:0 -9px;padding-left:9px;padding-right:9px}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .hero-bg{height:200px}
  .hero-title{font-size:18px}
  .hero-title .accent{font-size:20px}
  .stat .num{font-size:22px}
  .toast-container{left:12px;right:12px;bottom:12px;max-width:none}
}
@media print{
  .top,.nav,.footer,.toast-container,.hero-actions,.btn{display:none!important}
  body{background:#fff;color:#000}
  .card{border:1px solid #ccc;background:#fff;color:#000;box-shadow:none}
  .notice{background:#f5f5f5;color:#000}
}
</style>
</head>
<body>

<!-- ========== OFFLINE BANNER ========== -->
<div class="offline-banner" id="offlineBanner">📡 لا يوجد اتصال بالإنترنت — وضع offline</div>

<!-- ========== APP ========== -->
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-title">
        <h1>أمازون كول</h1>
        <div class="sub">HVAC PRO & STORE</div>
      </div>
      <span id="modeBadge" class="badge">وضع تجريبي</span>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>
  <main id="app"></main>
  <footer class="footer">
    أمازون كول — صيانة وتركيب وتشخيص وتجارة أجهزة التكييف<br>
    <span style="font-size:11px;opacity:.6">© 2026 جميع الحقوق محفوظة</span>
  </footer>
</div>

<!-- ========== AUTH MODAL ========== -->
<div class="modal" id="authModal">
  <div class="modalbox">
    <div class="modal-head">
      <h2 id="authTitle">تسجيل الدخول</h2>
      <button class="btn sm" onclick="closeAuth()">✕</button>
    </div>
    <div id="authMsg"></div>
    <form onsubmit="submitAuth(event)" novalidate>
      <div id="nameWrap" class="field hidden">
        <label>الاسم الكامل</label>
        <input id="authName" placeholder="أحمد محمد">
      </div>
      <div id="phoneWrap" class="field hidden">
        <label>رقم الهاتف</label>
        <input id="authPhone" type="tel" placeholder="01xxxxxxxxx">
      </div>
      <div class="field" id="emailField">
        <label>البريد الإلكتروني <span class="req">*</span></label>
        <input id="authEmail" type="email" placeholder="you@example.com" required>
        <div class="error">بريد غير صحيح</div>
      </div>
      <div class="field" id="passField">
        <label>كلمة المرور <span class="req">*</span></label>
        <input id="authPassword" type="password" minlength="6" placeholder="6 أحرف على الأقل" required>
        <div class="error">كلمة المرور 6 أحرف على الأقل</div>
      </div>
      <button class="btn primary block" id="authSubmit" type="submit" style="padding:13px">دخول</button>
    </form>
    <button class="btn block" style="margin-top:8px" onclick="toggleAuthMode()" id="authSwitch">إنشاء حساب جديد</button>
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span class="muted-sm">أو</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>
    <button onclick="loginWithGoogle()" class="btn block" style="background:#fff;color:#333;border-color:#ddd;padding:12px;margin-bottom:8px;font-weight:700">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20.4H24v7.2h11.2c-1.6 4.6-6 7.9-11.2 7.9-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.1-5.1C34 6.8 29.3 5 24 5 13.5 5 5 13.5 5 24s8.5 19 19 19c10.5 0 19-8.5 19-19 0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6 4.4C14 15.6 18.6 13 24 13c3.1 0 5.9 1.2 8 3.1l5.1-5.1C34 6.8 29.3 5 24 5c-7.6 0-14.1 4.3-17.7 9.7z"/><path fill="#4CAF50" d="M24 43c5.2 0 9.9-1.8 13.6-4.8l-6.1-5.2C29.5 34.6 26.9 35.5 24 35.5c-5.2 0-9.5-3.3-11.1-7.9l-6 4.6C10.5 38.5 16.8 43 24 43z"/><path fill="#1976D2" d="M43.6 20.5H42V20.4H24v7.2h11.2c-.7 2.2-2 4.1-3.7 5.5l6.1 5.2C41.2 34.9 43 30 43 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
      الدخول بحساب Google
    </button>
    <button onclick="loginWithFacebook()" class="btn block" style="background:#1877F2;color:#fff;border:none;padding:12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      الدخول بحساب Facebook
    </button>
  </div>
</div>
<!-- ========== CONFIRM MODAL ========== -->
<div class="modal" id="confirmModal">
  <div class="modalbox" style="max-width:420px">
    <div class="modal-head"><h2 id="confirmTitle">تأكيد</h2></div>
    <p id="confirmMsg" style="margin:0 0 18px 0;font-size:15px;line-height:1.7"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="closeConfirm(false)" id="confirmNo">إلغاء</button>
      <button class="btn primary" onclick="closeConfirm(true)" id="confirmYes">تأكيد</button>
    </div>
  </div>
</div>

<!-- ========== INPUT MODAL ========== -->
<div class="modal" id="inputModal">
  <div class="modalbox" style="max-width:420px">
    <div class="modal-head"><h2 id="inputTitle">إدخال</h2></div>
    <div class="field">
      <label id="inputLabel">القيمة</label>
      <input id="inputField">
      <div class="error" id="inputError"></div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="closeInput(null)">إلغاء</button>
      <button class="btn primary" onclick="submitInput()">موافق</button>
    </div>
  </div>
</div>

<!-- ========== INVOICE MODAL ========== -->
<div class="modal" id="invoiceModal">
  <div class="modalbox">
    <div class="modal-head">
      <h2>🧾 فاتورة</h2>
      <button class="btn sm" onclick="closeInvoice()">✕</button>
    </div>
    <div id="invoiceContent"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary block" onclick="printInvoice()">🖨️ طباعة / PDF</button>
    </div>
  </div>
</div>

<!-- ========== RATING MODAL ========== -->
<div class="modal" id="ratingModal">
  <div class="modalbox" style="max-width:420px">
    <div class="modal-head"><h2>⭐ قيّم الخدمة</h2></div>
    <p class="muted" style="text-align:center;margin-bottom:12px">رأيك يهمنا لتطوير خدمتنا</p>
    <div id="ratingStars" style="display:flex;justify-content:center;gap:8px;font-size:36px;margin:12px 0;cursor:pointer"></div>

    const parsed = JSON.parse(s);
    return parsed === null || parsed === undefined ? fallback : parsed;

}

    const el = document.createElement('div');

    const icons = { ok:'✅', err:'❌', info:'ℹ️', warn:'⚠️' };
    el.innerHTML = '<span>' + (icons[type] || '') + '</span><span>' + esc(msg) + '</span>';
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(20px)';
      setTimeout(() => el.remove(), 300);
    }, duration);
  },
  ok: (m) => Toast.show(m, 'ok'),
  err: (m) => Toast.show(m, 'err', 3500),
  info: (m) => Toast.show(m, 'info'),
  warn: (m) => Toast.show(m, 'warn', 3000)
};

const Confirm = {
  _resolve: null,
  ask(msg, title = 'تأكيد', yesText = 'تأكيد', noText = 'إلغاء') {
    return new Promise((resolve) => {
      this._resolve = resolve;
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmYes').textContent = yesText;
      document.getElementById('confirmNo').textContent = noText;
      document.getElementById('confirmModal').classList.add('open');
    });
  }
};
function closeConfirm(val) {
  document.getElementById('confirmModal').classList.remove('open');
  if (Confirm._resolve) { Confirm._resolve(val); Confirm._resolve = null; }
}

const InputPrompt = {
  _resolve: null,

    return new Promise((resolve) => {
      this._resolve = resolve;
      document.getElementById('inputTitle').textContent = title;
      document.getElementById('inputLabel').textContent = label;
      const inp = document.getElementById('inputField');
      inp.value = '';

      inp.classList.remove('invalid');
      document.getElementById('inputError').style.display = 'none';
      document.getElementById('inputModal').classList.add('open');
      setTimeout(() => inp.focus(), 100);
    });
  }
};
function closeInput(val) {
  document.getElementById('inputModal').classList.remove('open');
  if (InputPrompt._resolve) { InputPrompt._resolve(val); InputPrompt._resolve = null; }
}

async function submitAuth(e) {
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name = (document.getElementById('authName').value || '').trim();
  const phone = (document.getElementById('authPhone').value || '').trim();

  const emailField = document.getElementById('emailField');
  const passField = document.getElementById('passField');
  emailField.classList.remove('invalid');
  passField.classList.remove('invalid');

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    emailField.classList.add('invalid');
    return;
  }
  if (password.length < 6) {
    passField.classList.add('invalid');
    return;
  }

  LOG.info('🔑 محاولة', state.authMode === 'login' ? 'دخول' : 'تسجيل', 'لـ:', email);

  if (DEMO) {
    let users = safeRead('users', []);
    if (state.authMode === 'signup') {
      if (users.some(u => u.email === email)) {
        document.getElementById('authMsg').innerHTML = '<div class="notice err">البريد مستخدم بالفعل</div>';
        return;
      }
      const isFirst = users.length === 0;
      const u = { id: uid('u'), email, password, full_name: name || 'عميل جديد', phone, role: isFirst ? 'admin' : 'client', created_at: new Date().toISOString() };
      users.push(u);
      safeWrite('users', users);
      state.user = u;
      state.profile = u;
      state.role = u.role;
      LOG.ok('✅ حساب جديد:', email, '- role:', u.role);
    } else {
      const found = users.find(u => u.email === email && u.password === password);
      if (!found) {
        document.getElementById('authMsg').innerHTML = '<div class="notice err">البريد أو كلمة المرور غير صحيحة</div>';
        LOG.err('فشل الدخول:', email);
        return;
      }
      state.user = found;
      state.profile = found;
      state.role = found.role || 'client';
      LOG.ok('✅ تسجيل دخول:', email);
    }
    saveSession();
    closeAuth();
    Toast.ok('مرحباً بك ' + (state.profile.full_name || email));
    render();
    return;
  }

  try {
    let result;
    if (state.authMode === 'signup') {
      result = await db.auth.signUp({ email, password });
      if (result.error) throw result.error;
      if (result.data.user) {
        await db.from('users_profile').insert({
          id: result.data.user.id,
          full_name: name || 'عميل جديد',
          phone: phone || null,
          role: 'client'
        });
        state.user = result.data.user;
        state.role = 'client';
      }
    } else {
      result = await db.auth.signInWithPassword({ email, password });
      if (result.error) throw result.error;
      state.user = result.data.user;
      state.role = 'client';
    }
    saveSession();
    closeAuth();
    Toast.ok('تم بنجاح');
    render();
  } catch (err) {
    document.getElementById('authMsg').innerHTML = '<div class="notice err">' + esc(err.message) + '</div>';
    LOG.err('Auth error:', err.message);
  }
}

function filterProducts() {
  const q = (document.getElementById('productSearch')?.value || '').toLowerCase();
  const min = parseFloat(document.getElementById('priceMin')?.value) || 0;
  const max = parseFloat(document.getElementById('priceMax')?.value) || 0;
  let arr = products.filter(p => {
    const f = getFinalPrice(p);
    if (min && f < min) return false;
    if (max && f > max) return false;
    return (p.name + ' ' + (p.brand || '')).toLowerCase().includes(q);
  });
  const sort = document.getElementById('sortSelect')?.value || 'default';
  if (sort === 'priceLow') arr.sort((a, b) => a.price - b.price);
  else if (sort === 'priceHigh') arr.sort((a, b) => b.price - a.price);
  else if (sort === 'nameAz') arr.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

  const grid = document.getElementById('productGrid');
  if (!grid) return;
  if (!arr.length) {
    grid.innerHTML = '<div class="notice info" style="grid-column:1/-1;text-align:center">لا توجد نتائج مطابقة</div>';
    return;
  }
  grid.innerHTML = arr.map(p => {
    const final = getFinalPrice(p);
    return `<div class="product-card">
      <div class="img">
        ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">` : ''}
        ${p.discount > 0 ? `<span class="badge-discount">−${p.discount}%</span>` : ''}
      </div>
      <div class="body">
        <span class="pill">${esc(p.brand || '')}</span>
        <div class="name">${esc(p.emoji || '📦')} ${esc(p.name)}</div>
        <div class="price">${money(final)}${p.discount > 0 ? ` <span style="font-size:13px;color:#f87171;text-decoration:line-through">${money(p.price)}</span>` : ''}</div>
        <div class="muted-sm">متاح: ${p.stock}</div>
        <div class="actions">
          <button class="btn primary" ${p.stock < 1 ? 'disabled' : ''} onclick="addCart('${p.id}')">🛒 أضف</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function addProduct() {
  const name = document.getElementById('npName').value.trim();
  const brand = document.getElementById('npBrand').value.trim();
  const price = parseFloat(document.getElementById('npPrice').value);
  const discount = parseFloat(document.getElementById('npDiscount').value) || 0;
  const stock = parseInt(document.getElementById('npStock').value) || 0;
  const emoji = document.getElementById('npEmoji').value.trim() || '📦';
  const image = document.getElementById('npImage').value.trim();
  const description = document.getElementById('npDesc').value.trim();

  if (!name || !price || price <= 0) {
    Toast.err('اكتب الاسم والسعر');
    return;
  }
  products.push({
    id: uid('p'), name, brand, price, stock, emoji, image, description,
    discount: Math.min(90, Math.max(0, discount))
  });
  saveProducts();
  Toast.ok('تم إضافة المنتج');
  render();
}

async function editProduct(i) {
  const p = products[i];
  const newName = await InputPrompt.ask('اسم المنتج', p.name, 'تعديل المنتج');
  if (!newName) return;
  const newPriceStr = await InputPrompt.ask('السعر', String(p.price), 'تعديل السعر', 'number');
  if (!newPriceStr) return;
  const newStockStr = await InputPrompt.ask('المخزون', String(p.stock), 'تعديل المخزون', 'number');
  if (newStockStr === null) return;

  p.name = newName;
  p.price = parseFloat(newPriceStr) || p.price;
  p.stock = parseInt(newStockStr) || 0;
  saveProducts();
  Toast.ok('تم التعديل');
  render();
}

async function deleteProduct(i) {
  const ok = await Confirm.ask(`حذف "${products[i].name}"؟`, 'حذف منتج', 'احذف', 'إلغاء');
  if (!ok) return;
  products.splice(i, 1);

function addCart(id) {
  const p = products.find(x => x.id === id);
  if (!p || p.stock < 1) return;
  const x = state.cart.find(x => x.id === id);
  if (x) x.qty++;
  else state.cart.push({ id: p.id, name: p.name, price: getFinalPrice(p), qty: 1, emoji: p.emoji });
  saveCart();
  Toast.ok('تمت الإضافة للسلة');
  render();
}

function removeCart(i) {
  state.cart.splice(i, 1);
  saveCart();
  render();
}

function changeQty(i, delta) {
  const x = state.cart[i];
  if (!x) return;
  x.qty += delta;
  if (x.qty <= 0) state.cart.splice(i, 1);
  saveCart();
  render();
}

async function clearCart() {
  const ok = await Confirm.ask('تفريغ السلة بالكامل؟', 'تفريغ', 'نعم', 'إلغاء');
  if (!ok) return;
  state.cart = [];
  state.appliedCoupon = null;
  saveCart();
  render();
}

function removeCoupon() {
  state.appliedCoupon = null;
  render();
}

async function checkoutCart() {
  if (!state.user) { openAuth(); return; }
  if (!state.cart.length) return;

  const subtotal = cartTotal();
  const c = state.appliedCoupon ? coupons.find(x => x.code === state.appliedCoupon && x.active) : null;
  let discount = 0;
  if (c) {
    discount = Math.round(subtotal * c.discount / 100);
    if (c.maxDiscount && discount * 100 > c.maxDiscount) discount = Math.round(c.maxDiscount / 100);
  }
  const finalTotal = subtotal - discount;

  const order = {
    id: uid('o'),
    client_id: state.user.id,
    client_name: (state.profile && state.profile.full_name) || state.user.email,
    service_type: 'store',
    details: {
      items: state.cart,
      payment_method: 'cod',
      subtotal,
      coupon: state.appliedCoupon || null,
      coupon_discount: discount
    },
    total_amount: finalTotal,
    status: 'pending',
    created_at: new Date().toISOString(),
    timeline: [{ status: 'pending', at: new Date().toISOString() }]
  };

  const orders = safeRead('orders', []);
  orders.unshift(order);
  safeWrite('orders', orders);

  if (state.appliedCoupon) markCouponUsed(state.appliedCoupon);
  notifyWhatsApp(order);

  state.cart = [];
  state.appliedCoupon = null;
  saveCart();

  Toast.ok('تم تسجيل طلبك بنجاح');
  setPage('orders');
}

function orderCard(o) {
  try {
    const d = o.details || {};
    const map = {
      installation:'تركيب تكييف', uninstall:'فك تكييف', maintenance:'صيانة عامة',
      periodic:'صيانة دورية', diagnosis:'تشخيص عطل', piping:'تأسيس مواسير',
      cleaning:'تنظيف وغسيل', gas:'شحن غاز', store:'طلب متجر'
    };
    const icon = o.service_type === 'store' ? '🛒' : '🔧';
    const typeAr = map[o.service_type] || o.service_type || 'طلب';
    const statusMeta = {
      pending:   { color:'#f59e0b', label:'قيد المراجعة' },
      confirmed: { color:'#3b82f6', label:'مؤكد' },
      assigned:  { color:'#8b5cf6', label:'تم تعيين فني' },
      on_way:    { color:'#06b6d4', label:'الفني في الطريق' },
      arrived:   { color:'#10b981', label:'الفني وصل' },
      done:      { color:'#10b981', label:'مكتمل' },
      completed: { color:'#10b981', label:'مكتمل' },
      cancelled: { color:'#ef4444', label:'ملغي' }
    };
    const sm = statusMeta[o.status] || statusMeta.pending;
    const isStore = o.service_type === 'store';

    const timelineSteps = isStore
      ? [['pending','تم استلام الطلب'],['confirmed','تم التأكيد'],['assigned','قيد التجهيز'],['done','تم التسليم']]
      : [['pending','تم استلام الطلب'],['confirmed','تم التأكيد'],['assigned','تعيين فني'],['on_way','في الطريق'],['arrived','وصل الفني'],['done','تم الانتهاء']];

    const orderStepIdx = timelineSteps.findIndex(s => s[0] === o.status);
    const activeIdx = orderStepIdx >= 0 ? orderStepIdx : (o.status === 'completed' ? timelineSteps.length - 1 : 0);

    return `<div class="card">
      <div class="row between">
        <div>
          <b style="font-size:15px">#${String(o.id).slice(-8)}</b>
          <div class="muted-sm">${formatDate(o.created_at)}</div>
        </div>
        <span class="pill" style="background:${sm.color};color:#fff">${sm.label}</span>
      </div>

      <div style="margin:10px 0;font-weight:700">${icon} ${typeAr}</div>
      ${o.total_amount ? `<div class="price">${money(o.total_amount)}</div>` : ''}

      ${d.coupon_discount > 0 ? `<div style="color:var(--green);font-size:12px;margin-top:4px">🎟️ خصم: −${money(d.coupon_discount)} (${esc(d.coupon || '')})</div>` : ''}
      ${d.bookingDate ? `<div style="color:var(--green);font-size:12px;margin-top:6px">📅 ${formatArabicDate(d.bookingDate)} ${d.bookingTime || ''}</div>` : ''}
      ${d.address ? `<div class="muted-sm" style="margin-top:4px">📍 ${esc(String(d.address).slice(0, 90))}</div>` : ''}
      ${d.tech_name ? `<div style="color:var(--purple);font-size:12px;margin-top:4px">👷 الفني: ${esc(d.tech_name)}</div>` : ''}
      ${d.emergency ? `<div style="color:#f87171;font-size:12px;margin-top:4px">🚨 طوارئ (+50%)</div>` : ''}

      ${o.status !== 'cancelled' ? `
        <div class="timeline">
          ${timelineSteps.map((s, i) => `
            <div class="timeline-step ${i < activeIdx ? 'done' : ''} ${i === activeIdx ? 'active' : ''}">
              <div class="label">${s[1]}</div>
            </div>
          `).join('')}
        </div>` : `<div class="notice err" style="margin-top:10px">تم إلغاء الطلب</div>`}

      <div class="row" style="margin-top:8px">
        <button class="btn sm" onclick="showInvoice('${o.id}')">🧾 فاتورة</button>
        ${(o.status === 'done' || o.status === 'completed') && !o.rating ? `<button class="btn sm amber" onclick="openRating('${o.id}')">⭐ قيّم</button>` : ''}
        ${o.rating ? `<span class="pill green">⭐ ${o.rating}/5</span>` : ''}
      </div>
    </div>`;
  } catch (e) {
    LOG.err('orderCard error:', e);
    return '<div class="notice err">خطأ في عرض الطلب</div>';
  }
}

function updateDateDisplay() {
  const input = document.getElementById('bookingDate');
  const display = document.getElementById('bookingDateDisplay');
  if (!input || !display) return;
  if (!input.value) { display.textContent = '📅 اختار يوم'; return; }
  const date = new Date(input.value + 'T00:00:00');
  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const today = new Date();
  const isToday = date.toDateString() === today.toDateString();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const isTomorrow = date.toDateString() === tomorrow.toDateString();
  let prefix = '📅';
  if (isToday) prefix = '🟢 النهاردة';
  else if (isTomorrow) prefix = '🟡 بكرة';
  display.textContent = prefix + ' — ' + days[date.getDay()] + ' ' + date.getDate() + ' ' + months[date.getMonth()];
}

function calcPipes() {
  const hp = parseFloat(document.getElementById('pipeHP').value);
  const len = parseFloat(document.getElementById('pipeLength').value) || 0;
  const units = parseInt(document.getElementById('pipeUnits').value) || 1;
  const type = document.getElementById('pipeType').value;
  const result = document.getElementById('pipeResult');
  if (len <= 0) { Toast.err('اكتب الطول'); return; }
  const base = pipePrices.perMeter[hp] || 200;
  const mult = pipePrices.typeMultiplier[type] || 1;
  const pipeCost = base * len * mult;
  const total = (pipeCost + pipePrices.accessories + pipePrices.installPerUnit) * units;
  let discount = 0;
  if (units >= 3) discount = pipePrices.discount3PlusUnits / 100;
  else if (units === 2) discount = pipePrices.discount2Units / 100;
  const finalTotal = Math.round(total * (1 - discount));
  const names = { standard:'تركيب عادي', hidden:'تركيب مخفي', decor:'تركيب ديكور' };
  result.innerHTML = `<div class="notice ok">
    <b style="color:#fbbf24">💰 التكلفة التقديرية</b><br><br>
    قدرة: <b>${hp} حصان</b><br>
    نوع: <b>${names[type]}</b><br>
    طول: <b>${len} متر</b><br>
    عدد: <b>${units}</b><br>
    سعر المتر: <b>${money(base)}</b><br>
    ${discount > 0 ? `خصم: <b style="color:var(--green)">−${Math.round(discount * 100)}%</b><br>` : ''}
    <hr style="border-color:var(--border);margin:12px 0">
    <div style="font-size:18px;text-align:center;color:#fbbf24;font-weight:900">الإجمالي: ${money(finalTotal)}</div>
    <p class="muted-sm" style="margin-top:8px;text-align:center">⚠️ سعر تقديري</p>
    <button class="btn primary block" style="margin-top:10px;background:var(--amber);color:#111" onclick="orderPiping(${finalTotal})">🔧 اطلب تأسيس</button>
  </div>`;
}

function calcCapacity() {
  const length = parseFloat(document.getElementById('calcLength')?.value) || 0;
  const width = parseFloat(document.getElementById('calcWidth')?.value) || 0;
  const height = parseFloat(document.getElementById('calcHeight')?.value) || 2.7;
  const manualVol = parseFloat(document.getElementById('vol')?.value) || 0;
  const result = document.getElementById('capResult');
  let volume = 0, source = '';
  if (length > 0 && width > 0) {
    volume = length * width * height;
    source = `المساحة: ${length}×${width}×${height} = ${volume.toFixed(1)} م³`;
  } else if (manualVol > 0) {
    volume = manualVol;
    source = `الحجم: ${volume} م³`;
  } else {
    Toast.err('ادخل الأبعاد أو الحجم'); return;
  }
  const factor = Number(document.getElementById('factor').value);
  const btu = volume * factor;
  let hp = '';
  if (btu <= 15000) hp = '1.5 حصان';
  else if (btu <= 22500) hp = '2.25 حصان';
  else if (btu <= 30000) hp = '3 حصان';
  else if (btu <= 48000) hp = '4 حصان';
  else if (btu <= 60000) hp = '5 حصان';
  else hp = 'أكثر من 5 حصان';
  result.innerHTML = `<div class="notice ok">${source}<br>معامل: <b>${factor}</b><br>الحمل: <b>${Math.round(btu).toLocaleString('ar-EG')} BTU/h</b><br>الاختيار: <b style="color:#67e8f9;font-size:18px">${hp}</b></div>`;
}

async function aiDiagnose() {
  const symptom = (document.getElementById('aiSymptom')?.value || '').trim();
  const device = (document.getElementById('aiDevice')?.value || '').trim();
  const result = document.getElementById('aiResult');
  const btn = document.getElementById('aiBtn');

  if (!symptom) { Toast.err('اكتب وصف العطل'); return; }
  if (!CONFIG.GEMINI_API_KEY) {
    result.innerHTML = '<div class="notice warn">⚠️ التشخيص بالذكاء الاصطناعي غير متاح حالياً<br><br>يمكنك استخدام <b>قاعدة الأكواد</b> في الأسفل.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> جارٍ التحليل...';
  result.innerHTML = '<div class="notice info">🔍 جارٍ التحليل...</div>';

  const prompt = `أنت مهندس تكييف محترف. الجهاز: ${device || 'غير محدد'}. الشكوى: ${symptom}. اكتب 3 أسباب محتملة مرتبة، مع الفحص المطلوب والحل لكل سبب. بالعربي المصري المبسط وبنقاط مرتبة.`;

  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + CONFIG.GEMINI_API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await r.json();
    if (!r.ok) throw new Error((data && data.error && data.error.message) || 'خطأ في الاتصال');
    const text = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || 'لم يصل رد.';
    result.innerHTML = '<div class="notice ok"><b>🤖 التحليل:</b><br><br>' + esc(text).replace(/\n/g, '<br>') + '</div>';
    LOG.ok('AI diagnosed successfully');
  } catch (e) {
    LOG.err('AI error:', e);
    result.innerHTML = '<div class="notice err">تعذر التحليل: ' + esc(e.message || e) + '</div>';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🤖 شخّص بالذكاء الاصطناعي';
  }
}

  if (!el) return;
  const apps = safeRead('tech_apps', []);
  if (!apps.length) { el.innerHTML = '<div class="muted">لا يوجد متقدمين بعد</div>'; return; }
  el.innerHTML = apps.map((a, i) => {
    const st = a.status || 'pending';
    const col = st === 'approved' ? 'var(--green)' : st === 'rejected' ? 'var(--red)' : 'var(--amber)';
    return `<div style="border-bottom:1px solid var(--border);padding:10px 0">
      <div class="row between">
        <b>${esc(a.name)}</b>
        <span class="pill" style="background:${col};color:#fff">${a.percent}%</span>
      </div>
      <div class="muted-sm">📞 ${esc(a.phone)}</div>
      <div class="muted-sm">📍 ${esc(a.city)}</div>
      <div class="muted-sm">💼 ${esc(a.exp || '')}</div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm green" onclick="setTechStatus(${i},'approved')">✅ قبول</button>
        <button class="btn sm red" onclick="setTechStatus(${i},'rejected')">❌ رفض</button>
      </div>
    </div>`;
  }).join('');
}

function setTechStatus(i, s) {
  const apps = safeRead('tech_apps', []);
  if (!apps[i]) return;
  apps[i].status = s;
  safeWrite('tech_apps', apps);
  Toast.ok(s === 'approved' ? 'تم القبول' : 'تم الرفض');
  loadTechApps();
}

/* ============================================================
   27) INVOICE
   ============================================================ */
function showInvoice(orderId) {
  const orders = safeRead('orders', []);
  const o = orders.find(x => x.id === orderId);
  if (!o) { Toast.err('الطلب غير موجود'); return; }
  const d = o.details || {};
  const items = d.items || [];
  const subtotal = d.subtotal || o.total_amount || 0;
  const discount = d.coupon_discount || 0;

  document.getElementById('invoiceContent').innerHTML = `
    <div style="text-align:center;padding:12px;border-bottom:2px solid var(--border);margin-bottom:14px">
      <h2 style="justify-content:center;margin:0">❄️ أمازون كول</h2>
      <div class="muted-sm">فاتورة إلكترونية</div>
    </div>
    <div class="row between" style="margin-bottom:8px">
      <span class="muted">رقم الفاتورة:</span>
      <b>#${String(o.id).slice(-8)}</b>
    </div>
    <div class="row between" style="margin-bottom:8px">
      <span class="muted">التاريخ:</span>
      <b>${formatDate(o.created_at)}</b>
    </div>
    <div class="row between" style="margin-bottom:14px">
      <span class="muted">العميل:</span>
      <b>${esc(o.client_name || '')}</b>
    </div>

    ${items.length ? `
      <table style="width:100%;border-collapse:collapse;margin:14px 0">
        <thead><tr style="background:var(--bg2)"><th style="padding:8px;text-align:right;border-bottom:1px solid var(--border)">المنتج</th><th style="padding:8px;border-bottom:1px solid var(--border)">الكمية</th><th style="padding:8px;border-bottom:1px solid var(--border)">السعر</th></tr></thead>
        <tbody>
          ${items.map(it => `<tr><td style="padding:8px;border-bottom:1px solid var(--border)">${esc(it.name)}</td><td style="padding:8px;border-bottom:1px solid var(--border);text-align:center">${it.qty}</td><td style="padding:8px;border-bottom:1px solid var(--border)">${money(it.price * it.qty)}</td></tr>`).join('')}
        </tbody>
      </table>
    ` : `<div class="notice"><b>${esc(o.service_type)}</b>${d.problem ? '<br>' + esc(d.problem) : ''}</div>`}

    <div style="border-top:2px solid var(--border);padding-top:12px">
      ${subtotal ? `<div class="row between"><span class="muted">المجموع:</span><b>${money(subtotal)}</b></div>` : ''}
      ${discount ? `<div class="row between" style="color:var(--green)"><span>خصم (${esc(d.coupon || '')}):</span><b>−${money(discount)}</b></div>` : ''}
      <div class="row between" style="margin-top:8px;font-size:20px"><span>الإجمالي:</span><b style="color:#67e8f9">${money(o.total_amount)}</b></div>
    </div>
    <div style="text-align:center;margin-top:20px;padding-top:14px;border-top:1px dashed var(--border)">
      <div class="muted-sm">شكراً لتعاملكم معنا — أمازون كول</div>
    </div>
  `;
  document.getElementById('invoiceModal').classList.add('open');
}

function closeInvoice() {
  document.getElementById('invoiceModal').classList.remove('open');
}

function printInvoice() {
  const el = document.getElementById('invoiceContent');
  if (typeof html2pdf === 'undefined') { window.print(); return; }
  html2pdf().from(el).set({
    margin: 10,
    filename: 'invoice-' + Date.now() + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).save();
  Toast.ok('تم تحميل الفاتورة PDF');
}

/* ============================================================
   28) RATING
   ============================================================ */
function openRating(orderId) {
  state.ratingOrderId = orderId;
  state.ratingValue = 0;
  const el = document.getElementById('ratingStars');
  el.innerHTML = [1, 2, 3, 4, 5].map(i => `<span data-i="${i}" onclick="setRating(${i})" style="transition:transform .15s">☆</span>`).join('');
  document.getElementById('ratingComment').value = '';
  document.getElementById('ratingModal').classList.add('open');
}

function setRating(v) {
  state.ratingValue = v;
  const el = document.getElementById('ratingStars');
  el.querySelectorAll('span').forEach((s, i) => {
    s.textContent = i < v ? '⭐' : '☆';
    s.style.transform = i < v ? 'scale(1.15)' : 'scale(1)';
  });
}

function submitRating() {
  if (!state.ratingValue) { Toast.err('اختار تقييم'); return; }
  const orders = safeRead('orders', []);
  const o = orders.find(x => x.id === state.ratingOrderId);
  if (!o) return;
  o.rating = state.ratingValue;
  o.rating_comment = document.getElementById('ratingComment').value.trim();
  o.rated_at = new Date().toISOString();
  safeWrite('orders', orders);
  document.getElementById('ratingModal').classList.remove('open');
  Toast.ok('شكراً لتقييمك!');
  render();
}

/* ============================================================
   29) POST-RENDER HOOKS
   ============================================================ */
function postRender() {
  if (state.page === 'store') filterProducts();
  if (state.page === 'diagnosis') renderFaults();
  if (state.page === 'orders') loadOrders();
  if (state.page === 'admin') { loadAdmin(); loadTechApps(); }
  if (state.page === 'tech_panel') loadTechPanel();
  if (state.page === 'tech_dashboard') {
    const t = safeRead('current_tech', null);
    if (t) loadTechPanel();
  }
  if (state.page === 'services') {
    setTimeout(() => {
      const d = document.getElementById('bookingDate');
      if (d && !d.value) {
        const t = new Date();
        const yyyy = t.getFullYear();
        const mm = String(t.getMonth() + 1).padStart(2, '0');
        const dd = String(t.getDate()).padStart(2, '0');
        d.value = yyyy + '-' + mm + '-' + dd;
        d.min = yyyy + '-' + mm + '-' + dd;
        updateDateDisplay();
      }
    }, 50);
  }
}

/* ============================================================
   30) ONLINE/OFFLINE
   ============================================================ */
window.addEventListener('online', () => {
  document.getElementById('offlineBanner').classList.remove('show');
  Toast.ok('تم استعادة الاتصال');
});
window.addEventListener('offline', () => {
  document.getElementById('offlineBanner').classList.add('show');
  Toast.warn('لا يوجد اتصال بالإنترنت');
});

/* ============================================================
   31) KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeAuth();
    closeConfirm(false);
    closeInput(null);
    closeInvoice();
    document.getElementById('ratingModal').classList.remove('open');
  }
});

/* ============================================================
   32) INIT
   ============================================================ */
function init() {
  const saved = safeRead('current_user', null);
  if (saved && !state.user) {
    state.user = { id: saved.id, email: saved.email, full_name: saved.full_name, phone: saved.phone };
    state.profile = { full_name: saved.full_name, phone: saved.phone };
    state.role = saved.role || 'client';
    LOG.ok('✅ استرجاع جلسة:', saved.email);
  }
  if (!navigator.onLine) document.getElementById('offlineBanner').classList.add('show');
  render();
  LOG.ok('🎉 التطبيق جاهز');
}

init();
</script>

    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('[HVAC] SW registered:', reg.scope))
      .catch(err => console.warn('[HVAC] SW failed:', err));
  });
}
